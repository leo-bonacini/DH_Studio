<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" role="img" aria-label="DH Studio">
  <defs>
    <linearGradient id="dhs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181a24"/>
      <stop offset="1" stop-color="#0c0d11"/>
    </linearGradient>
    <linearGradient id="dhs-arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="dhs-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- icon tile -->
  <g transform="translate(0,0)">
    <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#dhs-bg)" stroke="#2a2c3d" stroke-width="2"/>
    <line x1="24" y1="78" x2="52" y2="44" stroke="url(#dhs-arm)" stroke-width="8" stroke-linecap="round"/>
    <line x1="52" y1="44" x2="78" y2="55" stroke="url(#dhs-arm)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="24" cy="78" r="6.5" fill="#5b8def"/>
    <circle cx="52" cy="44" r="6.5" fill="#a78bfa"/>
    <rect x="71.5" y="48.5" width="13" height="13" rx="2.5" fill="#ffd700" transform="rotate(45 78 55)"/>
  </g>

  <!-- wordmark -->
  <text x="122" y="63" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5">
    <tspan fill="url(#dhs-text)">DH</tspan><tspan fill="url(#dhs-text)" dx="12">Studio</tspan>
  </text>
</svg>
