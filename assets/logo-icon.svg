<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="DH Studio">
  <defs>
    <linearGradient id="dhs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181a24"/>
      <stop offset="1" stop-color="#0c0d11"/>
    </linearGradient>
    <linearGradient id="dhs-arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#dhs-bg)" stroke="#2a2c3d" stroke-width="2"/>

  <!-- kinematic chain: base -> elbow -> wrist -->
  <line x1="30" y1="100" x2="66" y2="56" stroke="url(#dhs-arm)" stroke-width="10" stroke-linecap="round"/>
  <line x1="66" y1="56" x2="98" y2="70" stroke="url(#dhs-arm)" stroke-width="10" stroke-linecap="round"/>

  <!-- revolute joints -->
  <circle cx="30" cy="100" r="8" fill="#5b8def"/>
  <circle cx="66" cy="56" r="8" fill="#a78bfa"/>

  <!-- end-effector -->
  <rect x="90" y="62" width="16" height="16" rx="3" fill="#ffd700" transform="rotate(45 98 70)"/>
</svg>
